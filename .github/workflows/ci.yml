name: IntruShield CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend & Root Dependencies
        run: npm ci

      - name: Install Server Dependencies
        run: npm --prefix server ci

      - name: Run Linter (Oxlint)
        run: npm run lint

      - name: Run Unit & Integration Test Suite (Vitest)
        run: npm run test:all

      - name: Build Server (TypeScript)
        run: npm --prefix server run build

      - name: Build Frontend Client (Vite)
        run: npm run build
