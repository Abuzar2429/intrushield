version: '3.8'

services:
  intrushield-backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: intrushield-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=intrushield_soc_production_jwt_secret_key_2026
      - DATABASE_PATH=/app/data/intrushield.sqlite
    volumes:
      - sqlite-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  intrushield-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intrushield-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      intrushield-backend:
        condition: service_healthy

volumes:
  sqlite-data:
    driver: local
